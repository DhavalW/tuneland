# Keeps this world's code up to date with the main Tuneland repo.
#
# Runs daily. If DhavalW/tuneland changed, this copies the new code over
# this repo, keeping everything listed in the upstream .tuneland-keep file:
# wrangler.jsonc (this world's own Cloudflare resource IDs), this workflows
# folder (GitHub tokens cannot push workflow changes), and public/media
# (this artist's songs, which live in this repo, not in the code upstream).
# The push triggers Cloudflare Workers Builds, which redeploys the world.
# Because the keep-list is read from upstream, new entries reach every
# world without this (frozen) file ever changing. Artists never touch this.

name: Tuneland auto-update

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this world
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch the latest Tuneland
        run: |
          git clone --depth 1 https://github.com/DhavalW/tuneland /tmp/upstream
          rm -rf /tmp/upstream/.git

      - name: Overlay the update (keep everything in .tuneland-keep)
        run: |
          # the keep-list comes from upstream; fall back to the historical
          # exclusions if it is ever missing
          if [ -f /tmp/upstream/.tuneland-keep ]; then
            grep -v '^#' /tmp/upstream/.tuneland-keep | grep -v '^$' > /tmp/keep
          else
            printf '.git\n.github/workflows\nwrangler.jsonc\npublic/media\n' > /tmp/keep
          fi
          rsync -a --delete --exclude-from /tmp/keep /tmp/upstream/ ./

      - name: Commit and push if something changed
        run: |
          git config user.name 'tuneland-updater'
          git config user.email 'tuneland-updater@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update world code from tuneland upstream"
            git push
          else
            # keepalive: a tiny commit every ~50 quiet days so GitHub never
            # disables this schedule
            last=$(git log -1 --format=%ct)
            now=$(date +%s)
            if [ $(( (now - last) / 86400 )) -ge 50 ]; then
              date -u +%Y-%m-%dT%H:%M:%SZ > .tuneland-keepalive
              git add .tuneland-keepalive
              git commit -m "Keep the auto-updater awake"
              git push
            fi
          fi
